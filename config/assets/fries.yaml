# Fries Hydroelectric Project. Phase 1 test asset.
# Sources: FERC EA for P-2883 (Dec 2020); EIA-860M (2026-08); EIA-923; USGS.
name: Fries Hydroelectric Project
ids:
  ferc_project: P-2883
  eia_plant: 10798
  pjm_queue: O31                     # 5.21 MW, operational (from owner research; not yet verified here)
owner: Central Rivers Power US, LLC  # EIA-860M operator. FERC licensee of record: Aquenergy Systems, LLC
location: {county: Grayson, state: VA, river: New River}
market:
  iso: PJM
  zone: AEP
  pnode: "FRIES 12 KV FRIESHYD"      # UNVERIFIED: confirm in the PJM pnode feed once PJM_API_KEY is set
  timezone: America/New_York
capacity:
  nameplate_mw: 5.4                  # EIA-860M: GEN1 2.0, GEN2 0.8, GEN3 0.2, GEN4 2.4
  net_summer_mw: 5.0
  net_winter_mw: 4.9
hydro:
  usgs_site: "03164000"              # New River near Galax; drainage area ~= the dam's, so no scaling
  gross_head_ft: 39.77               # pool 2,188.27 - tailrace 2,148.50 (EA 2.1.1)
  q_max_cfs_prior: 2050              # mill units 1,250 + unit 4 800 (EA 2.1.4)
  q_min_unit_cfs: 60                 # smallest unit's minimum (EA 2.1.4)
  q_leakage_cfs: 10                  # spillway + canal leakage to the bypass (EA 2.1.4)
  pondage_af: 440                    # gross storage; operated run-of-river within 0.2 ft
  calibrated: null                   # filled by the calibration run (docs/calibration_protocol.md)
capacity_market:
  elcc_class: hydro_intermittent     # run-of-river; "hydro with non-pumped storage" if meaningful pondage
cost_priors_ferc_ea_2020usd:         # Aquenergy figures in the EA (Table 6), 2020 dollars
  annual_om_usd: 484010              # ~$95/kW-yr on 5.1 MW
  relicensing_cost_usd: 348840
  net_investment_usd: 904200
  dependable_capacity_mw: 2.34

# ---------------------------------------------------------------- valuation inputs
# All $ nominal. PLACEHOLDER = to be set by Adam; sources noted where known.
valuation:
  valuation_date: "2027-01-01"
  horizon_years: 20
  discount_rates: [0.08, 0.10, 0.12]
  tax_rate: 0.0                      # 0 = pre-tax unlevered DCF (PLACEHOLDER: set to model taxes)
  regimes:                           # generation scenarios from docs/calibration_params.json
    as_operated: {params_key: as_operated_regime, accredited_installed_mw: 2.5}
    restored:    {params_key: restored_v2,        accredited_installed_mw: 5.0}
  base_case: {regime: as_operated, hydrology: P50, capacity: mid, discount_rate: 0.10}

contract:                            # inherited-PPA toggle (base case: merchant PJM)
  enabled: false
  fixed_price_mwh: 50.0              # PLACEHOLDER
  capacity_sold_under_contract: true # if true, PJM capacity revenue goes to the offtaker, not us
  end_year: 2030                     # merchant after this year

costs:
  fixed_om_per_kw_yr: 60.0           # NREL ATB conventional hydro ~$28-154/kW-yr; brief default ~$60.
                                     # FERC EA (2020$) applicant O&M was $484,010/yr (~$95/kW-yr on 5.1 MW).
  om_basis_kw: 5400                  # nameplate kW used for $/kW-yr
  insurance_per_yr: 50000            # PLACEHOLDER
  property_tax_per_yr: 15000         # PLACEHOLDER
  ferc_annual_charges_per_yr: 10000  # PLACEHOLDER (FERC hydropower annual charges)
  market_participant_fees_per_yr: 25000   # PLACEHOLDER (PJM fees + market participant / QSE agent)
  scada_monitoring_per_yr: 12000     # PLACEHOLDER
  escalation: 0.025

capex:
  helene_repair:                     # power canal wall rehabilitation; construction authorized 2026-02-11
    total_usd: 3000000               # PLACEHOLDER
    insured_fraction: 0.5            # PLACEHOLDER (owner-borne = 1 - insured)
    spend_year: 2027
    return_to_service: "2027-07-01"  # PLACEHOLDER
  restoration:                       # return unit 4 to service ("restored" regime only)
    total_usd: 1500000               # PLACEHOLDER
    spend_year: 2027
    return_to_service: "2028-01-01"  # PLACEHOLDER; as-operated output until then
  relicensing_dam_safety_reserve:    # spillway capacity assessment open (FERC 2026-11-04), Part 12D
    - {name: spillway capacity remediation, usd: 1000000, year: 2029}   # PLACEHOLDER
    - {name: recreation facilities (license, by 2028-12-31), usd: 150000, year: 2028}   # PLACEHOLDER
  major_overhauls:                   # optional
    - {name: unit 1 rewind, usd: 400000, year: 2032}   # PLACEHOLDER
